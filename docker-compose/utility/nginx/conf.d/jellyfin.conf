server {
    listen 80;
    server_name jellyfin.home;

    # Security and buffering headers
    client_max_body_size 20M;
    proxy_buffering off;

    location / {
        # Point this to your server's IP and Jellyfin's port
        proxy_pass http://[LOCAL_IP_ADDRESS]:8096;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Protocol $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Jellyfin strictly requires this block to handle WebSockets
    location /socket {
        proxy_pass http://[LOCAL_IP_ADDRESS]:8096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Protocol $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}